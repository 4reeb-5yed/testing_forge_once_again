version: "2.0"

nlu:
- intent: greet
  examples: |
    - hey
    - hello
    - hi
    - good morning
    - good evening
    - hey there

- intent: goodbye
  examples: |
    - bye
    - goodbye
    - see you around
    - see you later

- intent: affirm
  examples: |
    - yes
    - indeed
    - of course
    - that sounds good
    - correct

- intent: deny
  examples: |
    - no
    - never
    - I don't think so
    - don't like that
    - no way

- intent: mood_great
  examples: |
    - I am doing great
    - I am feeling very good
    - I am fantastic
    - I am amazing
    - I am wonderful

- intent: mood_unhappy
  examples: |
    - I am sad
    - I am unhappy
    - I am depressed
    - I am so sad
    - I'm feeling down
